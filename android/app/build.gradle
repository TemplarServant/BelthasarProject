// The app: SDL's Java activity (third_party/SDL2-src, tools/get_sdl2_src.ps1) + the game's native library, built by
// the NDK's CMake from the repository's root CMakeLists.txt (its ANDROID branch, android/CMakeLists.cmake).
plugins {
    id 'com.android.application'
}

// The release signing key (belthasar-release.jks, never committed): android/keystore.properties on the owner's machine,
// or the ANDROID_KEYSTORE_* / ANDROID_KEY_* environment variables a CI runner fills from the repository's secrets.
// Without either the release build stays unsigned.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def signingValue = { String key, String env -> signingProps.getProperty(key) ?: System.getenv(env) }
def releaseStore = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')

android {
    namespace 'org.belthasar.ct'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.belthasar.ct'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                // a phone (arm64) and the x86_64 emulator; add 'armeabi-v7a' for old 32-bit devices
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }
    signingConfigs {
        if (releaseStore) {
            release {
                storeFile rootProject.file(releaseStore)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseStore) {
                signingConfig signingConfigs.release
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
            buildStagingDirectory file('.cxx')
        }
    }
    sourceSets {
        main {
            java.srcDirs += ['../../third_party/SDL2-src/android-project/app/src/main/java']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError false
    }
}
